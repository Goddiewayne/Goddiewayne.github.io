<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <title>StreamVerse TV</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 10%, #132c42 0, #080b12 48%, #040508 100%); color: #f5fbff; }
      main { width: min(620px, calc(100% - 40px)); text-align: center; padding: 52px 28px; }
      .mark { width: 72px; height: 72px; margin: auto; display: grid; place-items: center; border-radius: 22px; background: linear-gradient(145deg, #25d8ff, #7158ff); box-shadow: 0 20px 70px #1fcbea4d; font-size: 34px; }
      h1 { margin: 26px 0 12px; font-size: clamp(34px, 8vw, 58px); letter-spacing: -.055em; }
      p { color: #aebdca; font-size: 18px; line-height: 1.6; }
      a { display: inline-flex; margin-top: 18px; padding: 14px 22px; border-radius: 999px; background: #25d8ff; color: #051017; text-decoration: none; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">▶</div>
      <h1>StreamVerse TV</h1>
      <p>Live television, tuned for Android Mobile and Android TV.</p>
      <a href="https://github.com/Goddiewayne/StreamVerse-TV/releases">Get StreamVerse</a>
    </main>
  </body>
</html>
