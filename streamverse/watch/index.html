<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <title>Watch on StreamVerse TV</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 8%, #153650, #080b12 52%, #040508); color: #f5fbff; }
      main { width: min(620px, calc(100% - 40px)); text-align: center; padding: 48px 24px; }
      .pulse { width: 76px; height: 76px; margin: auto; display: grid; place-items: center; border-radius: 24px; background: linear-gradient(145deg, #25d8ff, #7158ff); box-shadow: 0 20px 70px #1fcbea55; font-size: 34px; }
      h1 { margin: 26px 0 12px; font-size: clamp(32px, 7vw, 52px); letter-spacing: -.05em; }
      p { color: #aebdca; font-size: 18px; line-height: 1.6; }
      a { display: inline-flex; margin-top: 18px; padding: 14px 22px; border-radius: 999px; background: #25d8ff; color: #051017; text-decoration: none; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <div class="pulse" aria-hidden="true">▶</div>
      <h1>Open this channel in StreamVerse</h1>
      <p>If StreamVerse is installed, Android opens the shared channel automatically. Otherwise, install the latest mobile app and open the link again.</p>
      <a href="https://github.com/Goddiewayne/StreamVerse-TV/releases">Get StreamVerse</a>
    </main>
  </body>
</html>
